<!DOCTYPE html>
<html lang="es">
 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grano&Click - Contáctanos</title>
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
 
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/contacto.css">

  <link rel="icon" href="assets/IconoLogo.png" />
 
</head>
 
<body>
 
  <header id="encabezado"></header>

  <main>
  <div id="contactoHere">
    <section class="contact-section">
      <div class="container">
        <div class="row contact-container-wrapper g-0"> 
          <div class="col-md-6 contact-img d-none d-md-block">
            <img src="assets/contactanos.jpg" alt="Granos de café" class="contact-img-element">
          </div>
          <div class="col-12 col-md-6">
            <div class="contact-box">
              <h2 class="text-center mb-5" style="color: var(--hgColor); font-weight: 200; letter-spacing: 1px;">Contáctanos</h2>
              <form id="contactForm">
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre:</label>
                  <input type="text" id="nombre" class="form-control custom-input" placeholder="Escribe tu nombre" required>
                </div>
                <div class="mb-3">
                  <label for="correo" class="form-label">Correo electrónico:</label>
                  <input type="email" id="correo" class="form-control custom-input" placeholder="correo@example.com" required>
                </div>
                <div class="mb-3">
                  <label for="telefono" class="form-label">Teléfono:</label>
                  <input type="text" id="telefono" class="form-control custom-input" placeholder="Escribe tu número" required>
                </div>
                <div class="mb-3">
                  <label for="mensaje" class="form-label">Mensaje:</label>
                  <textarea id="mensaje" class="form-control custom-input" rows="4" placeholder="Escribe tu mensaje" required></textarea>
                </div>
                <div class="text-center">
                  <button id="enviar" class="btn btn-custom-send">Enviar</button>
                </div>
              </form>
              <div id="respuesta" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
 
  <div id="footer-container"></div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/main.js"></script>
  <script src="js/apiSesion.js"></script>
  <script src="js/navBarAndFooter.js"></script>
  <script type="module" src="js/contacto.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</body>
 
</html>
