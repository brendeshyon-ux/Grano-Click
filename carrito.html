<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grano&Click - Carrito</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/carrito.css">
  <link rel="icon" href="../assets/IconoLogo.png" />
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

</head>

<body>
  <header id="encabezado"></header>

  <main>
    <div id="carritoHere">


      <div class="container ">

        <table id="tablaCarrito" class="display">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Precio</th>
              <th>Subtotal</th>
              <th>Borrar</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>

        <div class="d-flex justify-content-end align-items-center mt-3">
          <label for="InpTotal" class="me-2 fw-bold text-white">Total:</label>
          <input type="text" id="InpTotal" class="form-control w-auto" readonly />
        </div>
        <div class="d-flex justify-content-center gap-3 mt-4 py-3">
          <button id="btnRegresar" class="btn btn-warning fw-bold px-4">REGRESAR</button>
          <button id="btnContinuar" class="btn btn-warning fw-bold px-4">CONTINUAR</button>
        </div>
      </div>

  </main>


  <div id="footer-container"></div>



  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/apiSesion.js"></script>
  <script src="../js/navBarAndFooter.js"></script>
  <script src="../js/carrito.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

</body>

</html>
