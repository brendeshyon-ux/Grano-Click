<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nueva contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/recuperar.css" />

    <link rel="icon" href="assets/IconoLogo.png" /> 

</head>

<body>

    <header id="encabezado"></header>

    <main class="main-content d-flex align-items-center justify-content-center">
    <div class="container">
        <!-- Contenedor principal con estilo de tarjeta -->
        <div class="recuperar-container-wrapper mx-auto">
            <div class="form-recuperar">
                <h1 class="text-center mb-4">Recuperar Contraseña</h1>
                
                <form id="recuperarForm" novalidate>
                    <div class="mb-3">
                        <label for="correoRecupera" class="frmlbl">Correo electrónico:</label>
                        <input type="email" placeholder="ejemplo@dominio.com" id="correoRecupera" class="frminp" required>
                    </div>

                    <div class="mb-3">
                        <label for="nuevaContra" class="frmlbl">Nueva contraseña:</label>
                        <input type="password" placeholder="Nueva contraseña" class="frminp" id="nuevaContra" required>
                    </div>

                    <div class="mb-3">
                        <label for="repetirNueva" class="frmlbl">Repetir contraseña:</label>
                        <input type="password" placeholder="Repetir contraseña" class="frminp" id="repetirNueva" required>
                    </div>

                    <div class="mb-3">
                        <label for="telefonoRecupera" class="frmlbl">Teléfono (10 dígitos):</label>
                        <input type="tel" placeholder="5512345678" id="telefonoRecupera" class="frminp" required>
                    </div>

                    <button class="Btn mt-4" type="submit">Actualizar Contraseña</button>

                    <!-- El JS inyectará aquí las alertas con el nuevo estilo CSS -->
                    <div id="alert-messages" class="mt-4"></div>
                </form>
            </div>
        </div>
    </div>
</main>

    <div id="footer-container"></div>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/main.js"></script>
    <script src="js/navBarAndFooter.js"></script>
    <script src="css/main.css"></script>
    <script type="module" src="js/recuperarContra.js"></script>

</body>


</html>
