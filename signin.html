<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrar Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/signin.css" />
    <link rel="stylesheet" href="css/main.css" />

    <link rel="icon" href="assets/IconoLogo.png" />
</head>

<body>

    <header id="encabezado"></header>

    <main class="main-content d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row login-container-wrapper g-0">
                <div class="col-md-4 login-img d-none d-md-block">
                    <img src="assets/registrarse.jpg" alt="Granos de café" class="login-img-element">
                </div>

                <div class="col-12 col-md-8">
                    <div class="form-signin">
                        <h1 class="text-center mb-4">Registrar nuevo usuario</h1>

                        <form id="signinForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="userName" class="frmlbl">Nombre:</label>
                                        <input type="text" placeholder="Escribe tu nombre" class="frminp" id="userName"
                                            required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userLastName" class="frmlbl">Apellido:</label>
                                        <input type="text" placeholder="Escribe tu apellido" class="frminp"
                                            id="userLastName" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userEmail" class="frmlbl">Correo electrónico:</label>
                                        <input type="email" placeholder="correo@example.com" class="frminp"
                                            id="userEmail" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userConfirmEmail" class="frmlbl">Confirmar correo:</label>
                                        <input type="email" placeholder="correo@example.com" class="frminp"
                                            id="userConfirmEmail" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userPhone" class="frmlbl">Teléfono:</label>
                                        <input type="text" placeholder="Escribe tu teléfono" class="frminp"
                                            id="userPhone" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userBirthDate" class="frmlbl">Fecha de nacimiento:</label>
                                        <input type="date" class="frminp" id="userBirthDate" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="userCounty" class="frmlbl">Municipio:</label>
                                        <input type="text" placeholder="Escribe tu municipio" class="frminp"
                                            id="userCounty" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userNeighborhood" class="frmlbl">Colonia:</label>
                                        <input type="text" placeholder="Escribe tu colonia" class="frminp"
                                            id="userNeighborhood" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userStreet" class="frmlbl">Calle y número:</label>
                                        <input type="text" placeholder="Escribe tu calle y número" class="frminp"
                                            id="userStreet" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userPostalCode" class="frmlbl">Código postal:</label>
                                        <input type="text" placeholder="Escribe tu código postal" class="frminp"
                                            id="userPostalCode" maxlength="5" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userPassword" class="frmlbl">Contraseña:</label>
                                        <input type="password" placeholder="Escribe tu contraseña" class="frminp"
                                            id="userPassword" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userConfirmPassword" class="frmlbl">Confirmar contraseña:</label>
                                        <input type="password" placeholder="Confirma tu contraseña" class="frminp"
                                            id="userConfirmPassword" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row mt-4 g-3">
                                <div class="col-6">
                                    <button class="Btn" id="btnSignin" type="button">Registrarse</button>
                                </div>
                                <div class="col-6">
                                    <button class="Btn" id="btnCancel" type="button"
                                        style="filter: contrast(0.8);">Limpiar</button>
                                </div>
                            </div>

                            <div class="nota-container mt-4">
                                <p id="password-requirements" class="mb-2"></p>
                                <p class="nota-texto">* Se debe ser mayor a 18 años.</p>
                                <p class="nota-texto">* La contraseña debe tener 8–12 caracteres e incluir: mayúsculas,
                                    minúsculas, números y un carácter especial (@#$%&*()_\-+=).</p>
                            </div>

                            <div id="alert-messages" class="mt-3"></div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="footer-container"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navBarAndFooter.js"></script>
    <script type="module" src="js/signin.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</body>

</html>
