<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/formularioCreacion.css">
  <link rel="stylesheet" href="css/main.css">

  <link rel="icon" href="assets/IconoLogo.png">
</head> 

<body>
  <header id="encabezado"></header>
  
  <main class="main-content d-flex align-items-center justify-content-center">
  <div class="container">
    <div class="row login-container-wrapper g-0">
      <div class="col-md-6 login-img d-none d-md-block">
        <img src="assets/iniciar_sesion.jpg" alt="Granos de café" class="login-img-element">
      </div>
      <div class="col-12 col-md-6">
        <div class="form-signin">
          <h1 class="text-center mb-5" style="color: var(--hgColor); font-weight: 200; letter-spacing: 1px;">Iniciar Sesión</h1>
          
          <form id="loginForm">
            <div class="mb-3">
              <label for="emails" class="frmlbl">Correo electrónico:</label>
              <input type="email" placeholder="correo@example.com" class="frminp" id="emails">
            </div>

            <div class="mb-3">
              <label for="pass" class="frmlbl">Contraseña:</label>
              <input type="password" placeholder="Escribe tu contraseña" class="frminp" id="pass">
            </div>

            <button class="Btn" id="send" type="submit">
              Iniciar Sesión
            </button>

            <div class="enlaces-login mt-4">
              <a href="recuperarContra.html" class="frma">¿Olvidaste tu contraseña?</a>
              <a href="signin.html" class="frma">¿Eres nuevo?, Crea tu cuenta</a>
            </div>
            
            <div id="alert-messages" class="mt-4"></div>
          </form>
        </div>
      </div>

    </div>
  </div>
</main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/navBarAndFooter.js"></script>
  <script src="js/login.js"></script>

</body>

</html>
