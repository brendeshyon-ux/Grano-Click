<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grano&Click - Menú Premium</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/productos.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="../assets/IconoLogo.png" />
</head>

<body>
  <header id="encabezado"></header>

  <main id="page-content" class="container">

    <section class="hero-premium my-5">
      <div class="hero-inner container d-flex align-items-center">
        <div class="hero-text-side col-lg-7 text-start">
          <h1 class="hero-title">CLICKS QUE SE DISFRUTAN.</h1>
          <p class="hero-subtitle">Cargados de energía.</p>

          <div class="hero-buttons mt-4 d-flex">
            <a href="#coffeTitle" class="btn btn-hero-primary px-5 py-2">Cafetería</a>
            <a href="#reposteriaTitle" class="btn btn-hero-outline px-5 py-2">Repostería</a>
          </div>
        </div>

        <div class="hero-image-side col-lg-5">
          <img src="../assets/fondo5.png" alt="Café Destacado" class="floating-hero-img">
        </div>
      </div>
    </section>

    <div class="container my-5" id="product-list">

      <div class="category-divider" id="coffeTitle">
        <h2 class="category-title">NUESTROS CAFÉS</h2>
        <div class="line-with-diamond"></div>
      </div>
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-5 allCards mb-5" id="cards_cafe">
      </div>

      <div class="category-divider" id="reposteriaTitle">
        <h2 class="category-title">REPOSTERÍA ARTESANAL</h2>
        <div class="line-with-diamond"></div>
      </div>
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-5 allCards mb-5" id="cardsPostre">
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/navBarAndFooter.js"></script>
  <script type="module" src="../js/producto.js"></script>
</body>

</html>
