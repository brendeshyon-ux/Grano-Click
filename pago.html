<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pago.css">
    <link rel="icon" href="../assets/IconoLogo.png">
</head>

<body>
    <header id="encabezado"></header>
    <main>
        <div id="PagoHere"></div>
        <div class="container-pago">
            <img id="logo-ticket" src="../assets/LogoFooter.png">
            <h1 id="titulo">TICKET DE PAGO</h1>
            <p>Su total a pagar es:
            <div id="total"> MXN</div>
            </p>
            <form>
                <label for="nombre">Nombre como aparece en la tarjeta:</label>
                <input type="text" id="nombre" class="campos" required>

                <label for="numeroTarjeta">Número de tarjeta:</label>
                <input type="tel" id="numeroTarjeta" class="campos" maxlength="10" required>

                <div class="fila-pago">
                    <div class="grupo-campo">
                        <label for="ccv">CVC:</label>
                        <input type="tel" id="ccv" class="campos" maxlength="3" required>
                    </div>

                    <div class="grupo-campo">
                        <label>Vencimiento:</label>
                        <div class="vencimiento-inputs">
                            <input type="tel" id="mesVencimiento" class="campos" maxlength="2" placeholder="MM"
                                required>
                            <span class="separador">/</span>
                            <input type="tel" id="yearVencimiento" class="campos" maxlength="2" placeholder="AA"
                                required>
                        </div>
                    </div>
                </div>

                <label for="correo">Correo:</label>
                <input type="email" id="correo" class="campos" required>


                <button type="submit" id="pagar">Pagar</button>
                <div class="d-flex justify-content-between mt-3">
                    <button type="button" id="btnAtras" class="btn btn-outline-secondary w-45">Atrás</button>
                    <button type="button" id="btnCancelar" class="btn btn-outline-danger w-45">Cancelar Compra</button>
                </div>
            </form>
            <div id="alert-messages" class="mt-4"></div>

        </div>

    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/apiSesion.js"></script>
    <script src="../js/navBarAndFooter.js"></script>
    <script type="module" src="../js/pago.js"></script>

</body>

</html>
